
<div class="overlay">
  <img class="design" src="welcome.png" alt="Tournament Welcome Design">

  <div class="text tournament">
    <span id="tournament">TOURNAMENT NAME</span>
  </div>

  <div class="text team-a">
    <img id="logoA" src="" alt="Team A Logo">
    <span id="teamA">TEAM A FULL NAME</span>
  </div>

  <div class="text vs">VS</div>

  <div class="text team-b">
    <img id="logoB" src="" alt="Team B Logo">
    <span id="teamB">TEAM B FULL NAME</span>
  </div>

  <div class="text toss">
    <span id="toss">TOSS DETAILS</span>
  </div>
</div>

<div class="controls">
  <h3>Welcome Screen Details</h3>

  <label>Tournament Name</label>
  <input id="tournamentInput" placeholder="Tournament name">

  <label>Team A Full Name</label>
  <input id="teamAInput" placeholder="Team A name">

  <label>Team A Logo</label>
  <input id="logoAInput" type="file" accept="image/*">

  <label>Team B Full Name</label>
  <input id="teamBInput" placeholder="Team B name">

  <label>Team B Logo</label>
  <input id="logoBInput" type="file" accept="image/*">

  <label>Toss Winner</label>
  <select id="tossWinner">
    <option value="">Select toss winner</option>
    <option value="teamA">Team A</option>
    <option value="teamB">Team B</option>
  </select>

  <label>Toss Decision</label>
  <select id="tossDecision">
    <option value="">Select decision</option>
    <option value="elected to bat first">Bat First</option>
    <option value="elected to field first">Field First</option>
  </select>

  <button onclick="updateWelcome()">UPDATE WELCOME SCREEN</button>
</div>

<style>
.overlay {
  position: relative;
  width: 100%;
  max-width: 1000px;
  margin: 20px auto;
  overflow: hidden;
}

.design {
  width: 100%;
  display: block;
}

.text {
  position: absolute;
  color: white;
  font-weight: bold;
  text-align: center;
  text-shadow: 2px 2px 5px black;
}

.tournament {
  top: 8%;
  left: 10%;
  width: 80%;
  font-size: clamp(16px, 3vw, 32px);
}

.team-a {
  top: 30%;
  left: 5%;
  width: 35%;
  font-size: clamp(12px, 2.5vw, 24px);
}

.team-b {
  top: 30%;
  right: 5%;
  width: 35%;
  font-size: clamp(12px, 2.5vw, 24px);
}

.team-a img,
.team-b img {
  display: block;
  width: clamp(35px, 8vw, 90px);
  height: clamp(35px, 8vw, 90px);
  object-fit: contain;
  margin: 0 auto 8px;
}

.vs {
  top: 40%;
  left: 43%;
  width: 14%;
  font-size: clamp(18px, 4vw, 36px);
}

.toss {
  bottom: 10%;
  left: 5%;
  width: 90%;
  font-size: clamp(12px, 2.5vw, 24px);
}

.controls {
  max-width: 500px;
  margin: 20px auto;
  padding: 16px;
  background: #1d293b;
  color: white;
  border-radius: 12px;
}

.controls input,
.controls select {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 6px 0 14px;
  box-sizing: border-box;
}

.controls button {
  width: 100%;
  padding: 14px;
  background: #b6ff00;
  border: none;
  font-weight: bold;
}
</style>

<script>
let teamAName = "TEAM A";
let teamBName = "TEAM B";

function loadLogo(inputId, imageId) {
  const file = document.getElementById(inputId).files[0];

  if (file) {
    const reader = new FileReader();

    reader.onload = function(event) {
      document.getElementById(imageId).src = event.target.result;
    };

    reader.readAsDataURL(file);
  }
}

function updateWelcome() {
  const tournament =
    document.getElementById("tournamentInput").value.trim();

  teamAName =
    document.getElementById("teamAInput").value.trim() || "TEAM A";

  teamBName =
    document.getElementById("teamBInput").value.trim() || "TEAM B";

  document.getElementById("tournament").textContent =
    tournament || "TOURNAMENT NAME";

  document.getElementById("teamA").textContent = teamAName;
  document.getElementById("teamB").textContent = teamBName;

  loadLogo("logoAInput", "logoA");
  loadLogo("logoBInput", "logoB");

  const winner = document.getElementById("tossWinner").value;
  const decision = document.getElementById("tossDecision").value;

  let tossText = "TOSS DETAILS";

  if (winner && decision) {
    const winnerName = winner === "teamA" ? teamAName : teamBName;
    tossText = winnerName + " won the toss and " + decision;
  }

  document.getElementById("toss").textContent = tossText;
}
</script>
